<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embiez POC</title>
    <style>
      /* Plein écran, aucune marge */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Le canvas Three.js remplit toute la fenêtre */
      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* Couche HUD par-dessus le canvas (vide pour l'instant) */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* le HUD ne bloque pas la souris */
        font-family: monospace;
        color: #fff;
      }

      /* Texte du HUD (PV) en haut à gauche */
      #hud {
        padding: 10px;
        font-size: 16px;
        text-shadow: 1px 1px 0 #000;
      }

      /* Viseur au centre de l'écran */
      #crosshair {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        border-radius: 50%;
        background: #fff;
        opacity: 0.8;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <div id="crosshair"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

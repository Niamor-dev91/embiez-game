<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Embiez POC</title>
    <style>
      /* Plein écran, aucune marge */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      /* Le canvas Three.js remplit toute la fenêtre */
      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* Couche HUD par-dessus le canvas (vide pour l'instant) */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* le HUD ne bloque pas la souris */
        font-family: monospace;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
